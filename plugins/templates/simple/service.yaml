apiVersion: v1
kind: Service
metadata:
  name: {{k8s_name}}
{{#kube_vip_ip}}
  annotations:
    kube-vip.io/loadbalancerIPs: "{{kube_vip_ip}}"
{{/kube_vip_ip}}
spec:
{{#kube_vip_ip}}
  type: LoadBalancer
  loadBalancerClass: kube-vip.io/kube-vip-class
{{/kube_vip_ip}}
{{^kube_vip_ip}}
  type: ClusterIP
{{/kube_vip_ip}}
  selector:
    app: {{k8s_name}}
  ports:
    - name: {{port_name}}
      port: {{service_port}}
      targetPort: {{port_name}}
{{#grpc}}
      appProtocol: kubernetes.io/h2c
{{/grpc}}
