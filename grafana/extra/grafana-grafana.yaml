apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
spec:
    persistentVolumeClaim:
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
    service:
      metadata:
        labels:
          noa.re/discover: enabled
        annotations:
          teleport.dev/name: grafana
    deployment:
      spec:
        strategy:
          type: Recreate
        template:
          spec:
            securityContext:
              fsGroup: 472
            volumes:
              - name: grafana-data
                persistentVolumeClaim:
                  claimName: grafana-pvc
    config:
      security:
        csrf_trusted_origins: grafana.teleport.noa.re
      server:
        root_url: https://grafana.teleport.noa.re
      auth.generic_oauth:
        enabled: "true"
        name: idElephant
        client_id: grafana-fruktsallad
        client_secret: ignored
        auth_style: InHeader
        scopes: openid email profile groups offline_access
        auth_url: https://id.noa.re/authorize
        token_url: https://id.noa.re/token
        api_url: https://id.noa.re/userinfo
        use_pkce: "true"
        use_refresh_token: "true"
        allow_sign_up: "true"
        auto_login: "false"
        login_attribute_path: sub
        email_attribute_path: email
        role_attribute_path: "contains(groups[*], 'admin') && 'Admin' || 'Viewer'"
