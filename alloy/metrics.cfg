prometheus.remote_write "mimir" {
  endpoint {
    url = "http://mimir-distributor.mimir.svc:8080/api/v1/push"
    headers = {
      "X-Scope-OrgID" = "anonymous",
    }
  }
}

loki.write "central" {
  endpoint {
    url = "http://loki.loki.svc:3100/loki/api/v1/push"
    headers = {
      "X-Scope-OrgID" = "anonymous",
    }
  }
}

loki.source.kubernetes_events "cluster_events" {
  job_name   = "kubernetes-events"
  log_format = "json"
  forward_to = [loki.write.central.receiver]
}

prometheus.operator.servicemonitors "services" {
  forward_to = [prometheus.remote_write.mimir.receiver]
}

prometheus.operator.podmonitors "pods" {
  forward_to = [prometheus.remote_write.mimir.receiver]
}

discovery.kubernetes "nodes" {
  role = "node"
}

discovery.relabel "kubelet_resource_metrics" {
  targets = discovery.kubernetes.nodes.targets

  rule {
    target_label = "__address__"
    replacement  = "kubernetes.default.svc:443"
  }

  rule {
    source_labels = ["__meta_kubernetes_node_name"]
    target_label  = "__metrics_path__"
    replacement   = "/api/v1/nodes/$1/proxy/metrics/resource"
  }
}

prometheus.scrape "kubelet_resource_metrics" {
  targets = discovery.relabel.kubelet_resource_metrics.output

  job_name          = "kubelet-resource-metrics"
  scheme            = "https"
  scrape_interval   = "15s"
  bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"

  tls_config {
    ca_file     = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
    server_name = "kubernetes.default.svc"
  }

  forward_to = [prometheus.remote_write.mimir.receiver]
}

prometheus.scrape "static_hosts" {
  targets = [
    {
      __address__ = "hallon:9100",
      instance    = "hallon",
    },
    {
      __address__ = "smultron:9100",
      instance    = "smultron",
    },
    {
      __address__ = "lingon:9100",
      instance    = "lingon",
    },
    {
      __address__ = "hjortron:9100",
      instance    = "hjortron",
    },
    {
      __address__ = "havtorn:9100",
      instance    = "havtorn",
    },
    {
      __address__ = "nypon:9100",
      instance    = "nypon",
    },
    {
      __address__ = "nadia:9100",
      instance    = "nadia",
    },
  ]

  job_name        = "static-hosts"
  scrape_interval = "60s"
  metrics_path    = "/metrics"

  forward_to = [prometheus.remote_write.mimir.receiver]
}
