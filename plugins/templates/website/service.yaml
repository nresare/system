apiVersion: v1
kind: Service
metadata:
  name: {{k8s_name}}
spec:
  selector:
    app: {{k8s_name}}
  ports:
{{#backend_tls}}
    - name: https
      appProtocol: https
      protocol: TCP
      port: 443
      targetPort: https
{{/backend_tls}}
{{^backend_tls}}
    - protocol: TCP
      port: 80
      targetPort: 8080
{{/backend_tls}}
