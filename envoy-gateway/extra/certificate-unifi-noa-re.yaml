apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: unifi-noa-re
  namespace: envoy-gateway-system
spec:
  dnsNames:
  - unifi.noa.re
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
  privateKey:
    algorithm: ECDSA
    rotationPolicy: Always
  secretName: unifi-noa-re-tls

