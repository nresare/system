stringData:
  type: git
  url: https://github.com/nresare/fruktsallad
  # GitHub App credentials whose API base URL is the argo-idcat sidecar of the
  # repo-server, which answers argo-cd's installation token request with a
  # token from idcat. The repository in the path is what it asks idcat for.
  githubAppEnterpriseBaseUrl: http://127.0.0.1:8181/nresare/fruktsallad
  # argo-idcat ignores both IDs; idcat picks the installation.
  githubAppID: "1"
  githubAppInstallationID: "1"
  # Not a secret. argo-cd signs a JWT with this key for its token request, and
  # argo-idcat ignores the JWT; the key only has to parse. Generated with
  # `openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048` and not used
  # for anything else.
