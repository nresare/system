# rook-ceph operator chart values

#crds:
#  enabled: true

csi:
  installCsiOperator: true
  # Avoid rendering this chart value as null, which leaves Argo CD perpetually OutOfSync.
  createCsiOperatorResources: true
  cephcsi:
    tag: v3.17.1


enableDiscoveryDaemon: true

logLevel: INFO

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

currentNamespaceOnly: false
