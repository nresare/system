[[helm]]
namespace = "kube-system"
release = "cilium"
values = "cilium/values.yaml"

[[helm]]
namespace = "argo"
release = "argocd"
values = "argo/values.yaml"

[[helm]]
namespace = "rook-ceph"
release = "rook"
values = "rook-ceph/rook-ceph-values.yaml"

[[helm]]
namespace = "rook-ceph"
release = "csi-drivers"
values = "rook-ceph/csi-drivers-values.yaml"
extra-resources = "rook-ceph/extra"

[[copy]]
namespace = "acme-dns"
source = "acme-dns/manifests"
config = {"/etc/acme-dns/config.cfg" = "acme-dns/config.cfg"}

[[helm]]
namespace = "cert-manager"
release = "cert-manager"
values = "cert-manager/values.yaml"
extra-resources = "cert-manager/extra"

[[helm]]
namespace = "cert-manager"
release = "trust-manager"

[[helm]]
namespace = "envoy-gateway-system"
release = "envoy-gateway"
values = "envoy-gateway/values.yaml"
extra-resources = "envoy-gateway/extra"

[[helm]]
namespace = "metrics-server"
release = "metrics-server"

[[helm]]
namespace = "grafana"
release = "grafana-operator"
extra-resources = "grafana/extra"
values = "grafana/values.yaml"

[[helm]]
namespace = "kubelet-csr-approver"
release = "kubelet-csr-approver"

[[website]]
name = "zq.lu"
namespace = "web"
hugo-repo = "https://github.com/nresare/zq.lu"

[[website]]
name = "noa.re"
namespace = "web"
hugo-repo = "https://github.com/nresare/noa.re"
extra-hostnames = "nadia.resare.com"

[[helm]]
namespace = "surrealdb"
release = "surrealdb"
values = "surrealdb/values.yaml"

[[simple]]
namespace = "idmouse"
image = "nresare/idmouse"
extra-resources = "idmouse/extra"
k8s-role = "idmouse-signing-keys"
config = {"/config/idmouse.toml" = "idmouse/idmouse.toml"}

[[website]]
name = "k8s.noa.re"
namespace = "jwksproxy"
image = "nresare/jwksproxy:0.2.0"
replicas = 1
config = { "/config/jwksproxy.toml" = "jwksproxy/jwksproxy.toml" }

[[website]]
name = "repo.noa.re"
replicas = 2
namespace = "reposnake"
image = "nresare/reposnake:0.2.1"
args = ["-c", "/config/reposnake.toml"]
config = { "/config/reposnake.toml" = "reposnake/reposnake.toml" }
custom-token-audiences = ["idmouse", "sts.amazonaws.com"]
emptydir-path = "/var/tmp"

[website.env]
AWS_STS_REGIONAL_ENDPOINTS = "regional"
AWS_REGION = "eu-west-2"
AWS_ENDPOINT_URL = "http://rook-ceph-rgw-fruktsallad.rook-ceph.svc"
AWS_ROLE_ARN = "arn:aws:iam:::role/reposnake"
AWS_WEB_IDENTITY_TOKEN_FILE = "/var/run/secrets/tokens/sts.amazonaws.com"

[[helm]]
namespace = "teleport-cluster"
release = "teleport-cluster"
values = "teleport/cluster-values.yaml"
extra-resources = "teleport/extra"

[[helm]]
namespace = "teleport"
release = "teleport-kube-agent"
values = "teleport/agent-values.yaml"

[[website]]
name = "relcoord.noa.re"
namespace = "relcoord"
replicas = 2
image = "public.ecr.aws/portswigger-platform/relcoord:0.2.0-83fb2305"
config = {"/config/relcoord.toml" = "relcoord/relcoord.toml"}
custom-token-audiences = ["idmouse", "idcat.noa.re"]

[[website]]
name = "idcat.noa.re"
namespace = "idcat"
image = "public.ecr.aws/portswigger-platform/idcat:934b43e7"
replicas = 2
args = ["--debug"]
external-secrets = ["/app-keys"]
config = { "/config/idcat.toml" = "idcat/idcat.toml" }
custom-token-audiences = ["nats"]

[[helm]]
namespace = "randomsecret"
release = "randomsecret"

