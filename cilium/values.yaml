kubeProxyReplacement: true
k8sServiceHost: 192.168.168.168
k8sServicePort: 6443

routingMode: native
autoDirectNodeRoutes: true

enableIPv4Masquerade: true
ipv4NativeRoutingCIDR: 10.244.0.0/16

# ipv4 is enbled by default
ipv6:
  enabled: true
enableIPv6Masquerade: false
ipv6NativeRoutingCIDR: 2a01:4b00:ae0a:5000::/56

ipam:
  mode: kubernetes

bgpControlPlane:
  enabled: true
