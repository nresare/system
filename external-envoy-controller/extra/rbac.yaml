apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-envoy-controller
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-envoy-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: external-envoy-controller
subjects:
  - kind: ServiceAccount
    name: default
    namespace: external-envoy-controller
