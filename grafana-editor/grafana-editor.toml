listen = "0.0.0.0"
port = 8443
tls-cert-path = "/tls/tls.crt"
tls-key-path = "/tls/tls.key"
log-level = "INFO"

resource-server-url = "https://grafana-editor.noa.re"
origin = "https://id.noa.re"
scopes = ["email"]

[traces]
endpoint = "http://tempo.tempo.svc:4317"

[[role]]
name = "any-idelephant-user"
issuer = "https://id.noa.re"
audience = "https://grafana-editor.noa.re"

[grafana]
url = "http://grafana-service.grafana.svc:3000"
service-account-token-path = "/grafana-token/token"
sandbox-folder = "Sandbox"
